name: Deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "5 15 * * *"   # 毎日 0:05 (JST) に再ビルド → 終わったライブを自動でアーカイブへ
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      # Pages 設定に独自ドメインが無いあいだ（*.github.io）は「仮サイトモード」：
      #   github.io/inohara-jun-web/ で正しく表示し、検索エンジンには載せない
      # 独自ドメインを設定すると自動で「本番モード」に切り替わります
      - name: Build
        run: |
          if [[ "${{ steps.pages.outputs.host }}" == *github.io ]]; then
            echo "::notice::仮サイトモード (noindex) でビルドします"
            bundle exec jekyll build --config _config.yml,_config.staging.yml \
              --baseurl "${{ steps.pages.outputs.base_path }}"
          else
            echo "::notice::本番モードでビルドします (${{ steps.pages.outputs.host }})"
            bundle exec jekyll build
          fi
        env:
          JEKYLL_ENV: production
          TZ: Asia/Tokyo
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
